<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banca | Administrador</title>
    <link rel="stylesheet" href="../../globals.css">
    <link rel="stylesheet" href="./administrador.css">
</head>

<body>
    <!-- ENCABEZADO SUPERIOR -->
    <header class="cabecera">
        <div>
            <div class="header-content">
                <div class="header-left">
                    <img src="../Asesor/img/logo.png" alt="Banca 1 Logo" class="logoBanca">
                    <div class="header-title">
                        <h1>Banca</h1>
                        <h2>Administrador</h2>
                    </div>
                </div>
                <div class="header-right">
                    <div class="user-info">
                        <img src="../Asesor/img/asesor.png" alt="Admin Logo" class="asesorLogo">
                        <div class="user-details">
                            <h2 id="nombreUsuario">Administrador</h2>
                            <h3 id="codigoUsuarioHeader">ADM001</h3> <!-- CAMBIADO ID -->
                        </div>
                    </div>
                    <button id="btnSalir" class="btnSalir" name="btnSalir">Salir</button>
                </div>
            </div>
        </div>
    </header>

    <main id="contenedorAdministrador">

        <div class="textoPanelAdministrador">
            <h2 class="tituloPanelAdministrador">Panel de Administrador</h2>
        </div>

        <!-- NAVEGACIÓN -->
        <nav class="pestañas" id="barraNavegacion">
            <ul>
                <li class="pestañaCrear">
                    <a href="#" id="btnCrearUsuario">
                        <img src="../Asesor/img/agregar.png" alt="Crear Logo">Crear Usuario
                    </a>
                </li>
                <li class="pestañaGestionar">
                    <a href="#" id="btnGestionarUsuarios">
                        <img src="../Asesor/img/ver.png" alt="Gestionar Logo">Gestionar Usuarios
                    </a>
                </li>
            </ul>
        </nav>

        <!-- FORMULARIO -->
        <section id="seccionCrearUsuario">

            <h3 class="titulo-seccion">Crear Nuevo Usuario</h3>

            <form id="formularioCrearUsuario">

                <!-- Código y contraseña -->
                <div class="fila-formulario">

                    <div class="grupo-formulario">
                        <label for="codigoUsuarioInput">Código de Usuario</label>
                        <input type="text" id="codigoUsuarioInput" placeholder="Asesor001" required>
                    </div>

                    <div class="grupo-formulario">
                        <label for="contrasenaUsuario">Contraseña</label>
                        <input type="password" id="contrasenaUsuario" placeholder="********" required>
                    </div>

                </div>

                <!-- Rol -->
                <div class="grupo-formulario">
                    <label for="rolUsuario">Rol del Usuario</label>
                    <select id="rolUsuario" required>
                        <option value="">Seleccionar rol</option>
                        <option value="2">Asesor</option>
                        <option value="3">Director</option>
                        <option value="4">Cajero</option>
                    </select>
                </div>

                <!-- Botón crear -->
                <div class="acciones-formulario">
                    <button type="submit" id="btnCrear">Crear</button>
                </div>

            </form>
        </section>

        <!-- LISTA DE USUARIOS -->
        <div id="listaUsuarios"></div>

    </main>

</body>

<script src="administtrador.js"></script> <!-- NOMBRE CORREGIDO -->

</html>
