<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banca 1 | Iniciar Sesion</title>
    <meta name="author" content="Jean Steven Londoño Portillo">
    <meta name="robots" content="noindex, nofollow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../globals.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <section id="login">
        <img src="" alt="Logo Banca 1">
        <h2>Banca 1</h2>
        <h3>Sistema de Gestión Bancaria</h3>

        <h4>Iniciar Sesión</h4>
        <h4>Ingresa tus credenciales para acceder al sistema</h4>

        <form id="formLogin" action="" method="post">

            <label for="usuario">Código de Usuario</label>
            <input type="text" id="usuario" name="usuario" placeholder="Ingrese su usuario" required>

            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" name="contrasena" placeholder="Ingrese su contraseña" required>

            <button type="submit" id="btnLogin" name="btnLogin">Iniciar Sesión</button>
    </section>
</body>
<script src="login.js"></script>

</html>
