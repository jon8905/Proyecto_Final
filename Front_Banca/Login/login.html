<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banca 1 | Iniciar Sesion</title>
    <meta name="author" content="Jean Steven Londoño Portillo">
    <meta name="robots" content="noindex, nofollow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../globals.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="login-container">
        <div class="cabeceraLogin">
            <img src="logo.png" width="82" height="82" alt="">
            <h1 class="nombreBanca">Banca</h1>
            <p class="esloganBanca">Sistema de Gestión Bancaria</p>
        </div>

        <div class="login">
            <div class="card-header">
                <h4 class="card-title">Iniciar Sesión</h4>
                <p class="card-description">Ingresa tus credenciales para acceder al sistema</p>
            </div>
            <div class="card-content">
                <form id="formLogin" class="formLogin" action="" method="post">
                    <div class="form-field">
                        <label for="usuario">Código de Usuario</label>
                        <input type="text" id="usuario" name="usuario" placeholder="Digite su usuario." required>
                    </div>

                    <div class="form-field">
                        <label for="contrasena">Contraseña</label>
                        <input type="password" id="contrasena" name="contrasena" placeholder="Digite su contraseña." required>
                    </div>

                    <!-- Mensajes -->
                    <div id="msgError" class="alert-error"></div>

                    <button type="submit" class="btnLogin" id="btnLogin" name="btnLogin">
                        Iniciar Sesión
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>

<script src="login.js"></script>

</html>
